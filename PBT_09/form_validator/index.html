<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="form-card">
            <div class="form-header">
                <h1>Đăng ký tài khoản</h1>
                <p>Điền thông tin để tạo tài khoản mới</p>
            </div>

            <form id="registerForm" novalidate>

                <!-- Tên -->
                <div class="field-group" id="group-name">
                    <label for="name">Họ và tên <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name">
                        <span class="field-icon" id="icon-name"></span>
                    </div>
                    <span class="field-msg" id="msg-name"></span>
                </div>

                <!-- Email -->
                <div class="field-group" id="group-email">
                    <label for="email">Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="example@email.com" autocomplete="email">
                        <span class="field-icon" id="icon-email"></span>
                    </div>
                    <span class="field-msg" id="msg-email"></span>
                </div>

                <!-- Password -->
                <div class="field-group" id="group-password">
                    <label for="password">Mật khẩu <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="new-password">
                        <span class="field-icon" id="icon-password"></span>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel"></span>
                    <span class="field-msg" id="msg-password"></span>
                </div>

                <!-- Confirm Password -->
                <div class="field-group" id="group-confirm">
                    <label for="confirm">Xác nhận mật khẩu <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
                        <span class="field-icon" id="icon-confirm"></span>
                    </div>
                    <span class="field-msg" id="msg-confirm"></span>
                </div>

                <!-- Phone -->
                <div class="field-group" id="group-phone">
                    <label for="phone">Số điện thoại <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="0901-234-567" maxlength="12" autocomplete="tel">
                        <span class="field-icon" id="icon-phone"></span>
                    </div>
                    <span class="field-msg" id="msg-phone"></span>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit" disabled>
                    Đăng ký
                </button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal" aria-modal="true" role="dialog" aria-label="Đăng ký thành công">
        <div class="modal-box">
            <div class="modal-icon">🎉</div>
            <h2>Đăng ký thành công!</h2>
            <div class="modal-info" id="modalInfo"></div>
            <button class="btn-modal-close" id="modalCloseBtn">Đóng</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
