<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Game Đoán Số</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #475569;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #6366f1;
        }

        input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        #btnGuess {
            background: #6366f1;
            color: white;
        }

        #btnGuess:hover:not(:disabled) {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        #btnGuess:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #btnRestart {
            width: 100%;
            background: #10b981;
            color: white;
            margin-top: 16px;
        }

        #btnRestart:hover {
            background: #059669;
        }

        .result {
            min-height: 52px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            transition: all 0.3s;
        }

        .result.success {
            background: #064e3b;
            border-color: #10b981;
            color: #6ee7b7;
        }

        .result.lose {
            background: #450a0a;
            border-color: #dc2626;
            color: #fca5a5;
        }

        .result.warning {
            background: #422006;
            border-color: #f59e0b;
            color: #fcd34d;
        }

        .result.hint {
            background: #1e3a5f;
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .history {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            min-height: 22px;
            margin-bottom: 14px;
        }

        .progress-wrap {
            background: #334155;
            border-radius: 99px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #dc2626);
            border-radius: 99px;
            transition: width 0.4s;
        }

        .progress-label {
            font-size: 0.8rem;
            color: #64748b;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎮 Đoán Số</h1>
        <p class="subtitle">Số bí mật từ 1 đến 100 — bạn có 7 lần thử</p>

        <div class="input-row">
            <input type="number" id="inputGuess" min="1" max="100" placeholder="Nhập số...">
            <button id="btnGuess" onclick="makeGuess()">Đoán</button>
        </div>

        <div class="result" id="result">🤔 Hãy nhập một số và nhấn Đoán!</div>

        <div class="progress-wrap">
            <div class="progress-bar" id="attemptsBar"></div>
        </div>
        <div class="progress-label" id="progressLabel">0 / 7 lần</div>

        <div class="history" id="history"></div>

        <button id="btnRestart" onclick="startGame()">🔄 Chơi lại</button>
    </div>

    <script src="guess.js"></script>
</body>
</html>
